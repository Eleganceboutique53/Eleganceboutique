<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'Élégance Boutique</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#faf6ee;color:#241a12}
header{background:#2d1b0e;color:#fff;text-align:center;padding:28px 15px}h1{font-family:Georgia,serif;margin:0;font-size:32px}header p{margin:8px 0}
main{max-width:1000px;margin:auto;padding:18px}.top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:bold;cursor:pointer}.gold{background:#b8872d;color:white}.white{background:white;border:1px solid #ddd}
#products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #eadfce}.card img{width:100%;height:280px;object-fit:cover}.body{padding:14px}.price{font-size:21px;font-weight:bold;color:#9b6714}.old{text-decoration:line-through;color:#888;font-size:13px;margin-left:5px}.meta{color:#6d6257;margin:7px 0}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#fff;padding:20px;border-radius:18px;width:min(500px,100%)}label{display:block;font-weight:bold;margin-top:12px}input,select{width:100%;padding:12px;border:1px solid #d8c9b4;border-radius:10px;font-size:16px}.preview{width:100%;max-height:220px;object-fit:contain;display:none;margin-top:10px}.row{display:flex;gap:8px;margin-top:16px}.row button{flex:1}
.hide{display:none!important}.note{background:#fff;padding:14px;border-radius:14px;border:1px solid #eadfce;margin-bottom:18px}
</style>
</head>
<body>
<header><h1>L'ÉLÉGANCE BOUTIQUE</h1><p>Mode Homme & Femme • Disponible partout à Abidjan</p></header>
<main>
<div class="top">
<button class="gold" id="adminBtn">🔐 Espace propriétaire</button>
<button class="white hide" id="addBtn">＋ Ajouter un vêtement</button>
<button class="white hide" id="logoutBtn">Se déconnecter</button>
</div>
<div class="note">📲 WhatsApp : <b>07 08 76 90 21</b> • Tailles disponibles : <b>M à 2XL</b></div>
<div id="products"></div>
</main>

<div class="modal" id="login">
<div class="box">
<h2>Accès propriétaire</h2>
<p>Entre ton code pour gérer le catalogue.</p>
<input id="code" type="password" inputmode="numeric" placeholder="Code">
<div class="row"><button class="white" onclick="closeLogin()">Annuler</button><button class="gold" onclick="login()">Entrer</button></div>
</div></div>

<div class="modal" id="editor">
<div class="box">
<h2>Ajouter un vêtement</h2>
<label>Photo</label>
<input id="photo" type="file" accept="image/*">
<img id="preview" class="preview">
<label>Nom</label><input id="name" placeholder="Ex. Modèle homme">
<label>Prix actuel (FCFA)</label><input id="price" type="number" inputmode="numeric" placeholder="12000">
<label>Ancien prix (facultatif)</label><input id="old" type="number" inputmode="numeric" placeholder="15000">
<label>Taille</label><input id="size" value="M à 2XL">
<div class="row"><button class="white" onclick="closeEditor()">Annuler</button><button class="gold" onclick="addProduct()">Ajouter</button></div>
</div></div>

<script>
const KEY="elegance_simple_v3", ADMIN="2580";
let products=JSON.parse(localStorage.getItem(KEY)||"[]"), owner=false, photoData="";
const $=id=>document.getElementById(id);
$("adminBtn").onclick=()=>$("login").classList.add("show");
$("addBtn").onclick=()=>$("editor").classList.add("show");
$("logoutBtn").onclick=()=>{owner=false;updateUI()};
function closeLogin(){$("login").classList.remove("show")}
function closeEditor(){$("editor").classList.remove("show")}
function login(){if($("code").value===ADMIN){owner=true;$("code").value="";closeLogin();updateUI()}else alert("Code invalide");}
function updateUI(){$("addBtn").classList.toggle("hide",!owner);$("logoutBtn").classList.toggle("hide",!owner);render()}
$("photo").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{photoData=r.result;$("preview").src=photoData;$("preview").style.display="block"};r.readAsDataURL(f)}
function addProduct(){
 if(!photoData)return alert("Choisis une photo.");
 let n=$("name").value.trim(),p=$("price").value,o=$("old").value,s=$("size").value.trim()||"M à 2XL";
 if(!n||!p)return alert("Remplis le nom et le prix.");
 products.unshift({id:Date.now(),photo:photoData,name:n,price:Number(p),old:Number(o||0),size:s});
 localStorage.setItem(KEY,JSON.stringify(products));photoData="";$("photo").value="";$("preview").style.display="none";$("name").value="";$("price").value="";$("old").value="";$("size").value="M à 2XL";closeEditor();render();
}
function del(id){if(!owner)return;if(confirm("Supprimer cet article ?")){products=products.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(products));render()}}
function wa(x){let t=`Bonjour, je souhaite commander ${x.name} à ${x.price} FCFA. Taille : ${x.size}.`;location.href="https://wa.me/2250708769021?text="+encodeURIComponent(t)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(){
 $("products").innerHTML=products.length?products.map(x=>`<article class="card"><img src="${x.photo}"><div class="body"><b>${esc(x.name)}</b><div class="price">${x.price.toLocaleString("fr-FR")} FCFA ${x.old?`<span class="old">${x.old.toLocaleString("fr-FR")} FCFA</span>`:""}</div><div class="meta">Taille : ${esc(x.size)}<br>Disponible partout à Abidjan</div><div class="row"><button class="gold" onclick='wa(${JSON.stringify(x).replace(/'/g,"&#39;")})'>Commander WhatsApp</button>${owner?`<button class="white" onclick="del(${x.id})">Supprimer</button>`:""}</div></div></article>`).join(""):"<div class='note'>Aucun vêtement ajouté pour le moment.</div>"
}
render();updateUI();
</script>
</body></html>
