<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'Élégance Boutique</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fbf7ef;color:#2b2118}
header{background:linear-gradient(135deg,#3b210e,#6b4218);color:white;text-align:center;padding:35px 18px}
h1{margin:0;font-family:Georgia,serif;font-size:38px}
header p{font-size:18px;margin:15px 0 0}
main{max-width:1000px;margin:auto;padding:25px 16px}
button{border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{background:#c3932e;color:white}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.card{background:white;border:1px solid #eadfce;border-radius:20px;padding:18px;margin-bottom:20px;box-shadow:0 5px 18px #0000000d}
.info{font-size:17px;line-height:1.6}
#products{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.product{background:white;border-radius:18px;overflow:hidden;border:1px solid #e5d8c5;box-shadow:0 4px 15px #00000012}
.product img{width:100%;height:300px;object-fit:cover;background:#eee}
.product .body{padding:15px}
.product h3{margin:0 0 8px;font-size:20px}
.price{font-size:22px;font-weight:bold;color:#9b6812}
.size{color:#6b6258;margin:7px 0}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{padding:9px 11px;font-size:14px}
.edit{background:#eee;color:#222}.delete{background:#9b2d20;color:#fff}
.empty{text-align:center;padding:55px 20px;border:2px dashed #e2d5c2;border-radius:20px;color:#776d62;font-size:18px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.form{background:white;border-radius:20px;padding:22px;width:min(500px,100%);max-height:90vh;overflow:auto}
.form h2{margin-top:0}
label{display:block;font-weight:bold;margin:12px 0 6px}
input{width:100%;padding:13px;border:1px solid #d8cbb8;border-radius:10px;font-size:16px}
.preview{width:100%;max-height:220px;object-fit:contain;margin-top:10px;border-radius:12px;display:none}
.form-actions{display:flex;gap:10px;margin-top:18px}.form-actions button{flex:1}
.cancel{background:#eee}
#fileInput{display:none}
footer{text-align:center;padding:30px;color:#746a5d}
</style>
</head>
<body>

<header>
  <h1>L'ÉLÉGANCE BOUTIQUE</h1>
  <p>Mode homme & femme • Disponible partout à Abidjan</p>
</header>

<main>
  <div class="tools">
    <button class="primary" onclick="openForm()">＋ Ajouter un article</button>
    <button onclick="exportCatalog()">💾 Sauvegarder / exporter</button>
    <button onclick="document.getElementById('importInput').click()">📥 Importer</button>
    <input id="importInput" type="file" accept=".json" hidden onchange="importCatalog(event)">
  </div>

  <div class="card info">
    📲 <b>Commandes WhatsApp : 07 08 76 90 21</b><br>
    Ajoute toi-même les photos, le nom, le prix et la taille. Les articles restent enregistrés dans ce navigateur.
  </div>

  <div id="products"></div>
</main>

<footer>© L'Élégance Boutique — Abidjan</footer>

<div class="modal" id="modal">
  <div class="form">
    <h2 id="formTitle">Ajouter un article</h2>
    <input type="hidden" id="editId">

    <label>Photo de l'habit *</label>
    <input id="photo" type="file" accept="image/*" capture="environment" onchange="previewPhoto(event)">
    <img id="preview" class="preview">

    <label>Nom de l'article *</label>
    <input id="name" placeholder="Ex. Chemise homme 4 poches">

    <label>Prix (FCFA) *</label>
    <input id="price" type="number" inputmode="numeric" placeholder="12000">

    <label>Taille</label>
    <input id="size" placeholder="Ex. M à 2XL">

    <div class="form-actions">
      <button class="cancel" onclick="closeForm()">Annuler</button>
      <button class="primary" onclick="saveProduct()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const KEY = "elegance_boutique_products_v2";
let products = JSON.parse(localStorage.getItem(KEY) || "[]");
let currentPhoto = "";

function saveLocal(){
  localStorage.setItem(KEY, JSON.stringify(products));
}

function openForm(id=null){
  document.getElementById("modal").classList.add("show");
  document.getElementById("editId").value = id || "";
  document.getElementById("formTitle").textContent = id ? "Modifier l'article" : "Ajouter un article";
  document.getElementById("photo").value = "";
  document.getElementById("preview").style.display = "none";
  currentPhoto = "";

  if(id){
    const p=products.find(x=>x.id===id);
    if(!p)return;
    document.getElementById("name").value=p.name;
    document.getElementById("price").value=p.price;
    document.getElementById("size").value=p.size || "";
    currentPhoto=p.photo;
    const img=document.getElementById("preview");
    img.src=p.photo; img.style.display="block";
  }else{
    document.getElementById("name").value="";
    document.getElementById("price").value="";
    document.getElementById("size").value="";
  }
}

function closeForm(){document.getElementById("modal").classList.remove("show")}

function previewPhoto(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    currentPhoto=reader.result;
    const img=document.getElementById("preview");
    img.src=currentPhoto; img.style.display="block";
  };
  reader.readAsDataURL(file);
}

function saveProduct(){
  const name=document.getElementById("name").value.trim();
  const price=document.getElementById("price").value.trim();
  const size=document.getElementById("size").value.trim();
  const id=document.getElementById("editId").value;

  if(!name || !price){alert("Mets le nom et le prix.");return}
  if(!currentPhoto){alert("Ajoute une photo de l'habit.");return}

  if(id){
    const p=products.find(x=>x.id===id);
    p.name=name;p.price=price;p.size=size;p.photo=currentPhoto;
  }else{
    products.unshift({id:Date.now().toString(),name,price,size,photo:currentPhoto});
  }
  saveLocal(); render(); closeForm();
}

function deleteProduct(id){
  if(confirm("Supprimer cet article ?")){
    products=products.filter(p=>p.id!==id);
    saveLocal();render();
  }
}

function whatsapp(p){
  const text=`Bonjour, je suis intéressé(e) par : ${p.name}. Prix : ${p.price} FCFA. Taille : ${p.size || "à préciser"}.`;
  window.open("https://wa.me/2250708769021?text="+encodeURIComponent(text),"_blank");
}

function render(){
  const box=document.getElementById("products");
  if(!products.length){
    box.innerHTML='<div class="empty">Aucun article pour le moment.<br><br>Clique sur <b>＋ Ajouter un article</b> pour commencer.</div>';
    return;
  }
  box.innerHTML=products.map(p=>`
    <article class="product">
      <img src="${p.photo}" alt="${escapeHtml(p.name)}">
      <div class="body">
        <h3>${escapeHtml(p.name)}</h3>
        <div class="price">${Number(p.price).toLocaleString("fr-FR")} FCFA</div>
        <div class="size">Taille : ${escapeHtml(p.size || "Disponible sur demande")}</div>
        <div class="actions">
          <button class="primary" onclick="whatsapp(${JSON.stringify(p).replace(/"/g,'&quot;')})">WhatsApp</button>
          <button class="edit" onclick="openForm('${p.id}')">Modifier</button>
          <button class="delete" onclick="deleteProduct('${p.id}')">Supprimer</button>
        </div>
      </div>
    </article>`).join("");
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function exportCatalog(){
  const blob=new Blob([JSON.stringify(products)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="catalogue-elegance-boutique.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function importCatalog(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!Array.isArray(data))throw new Error();
      products=data;saveLocal();render();alert("Catalogue importé avec succès.");
    }catch(err){alert("Fichier invalide.");}
  };
  reader.readAsText(file);
}

render();
</script>
</body>
</html>
